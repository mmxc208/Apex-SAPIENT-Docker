<rect class="b" x="20" y="455" width="960" height="150" rx="10"/>
<text class="n" x="38" y="482">Keys</text><text class="m" x="120" y="482">sapient/v2/&lt;node_id&gt;/up/{status,detection,alert}</text>
<text class="m" x="120" y="503">sapient/v2/&lt;node_id&gt;/down/task</text>
<text class="n" x="38" y="532">Delivery</text><text class="q" x="120" y="532">Registration, tasks and alerts use Block. Detections may use Drop. Reliability is per hop.</text>
<text class="n" x="38" y="558">Presence</text><text class="q" x="120" y="558">When a liveliness token disappears, the HQ bridge closes that node's Apex socket.</text>
<text class="n" x="38" y="584">Later</text><text class="q" x="120" y="584">Native option: bridges move into Apex and the sensors. Routers and keys stay the same.</text>
</svg>
