<rect class="p" x="480" y="25" width="500" height="410" rx="12"/><text class="n" x="496" y="50">HQ</text>
<rect class="h" x="495" y="200" width="86" height="60" rx="10"/><text class="t" x="538" y="225">Router</text><text class="s" x="538" y="245">HQ</text>
