<path class="a" d="M287 132L322 132"/><text class="s" x="190" y="60">local TCP</text>
<rect class="p" x="20" y="240" width="400" height="195" rx="12"/><text class="n" x="36" y="265">Site B</text>
<rect class="b" x="40" y="277" width="112" height="56" rx="8"/><text class="t" x="96" y="301">RF detector</text><text class="s" x="96" y="320">unchanged</text>
<rect class="b" x="40" y="361" width="112" height="56" rx="8"/><text class="t" x="96" y="385">Vehicle</text><text class="s" x="96" y="404">unchanged</text>
<rect class="d" x="195" y="317" width="92" height="60" rx="8"/><text class="t" x="241" y="342">Bridge</text><text class="s" x="241" y="362">per node</text>
<rect class="h" x="322" y="317" width="86" height="60" rx="10"/><text class="t" x="365" y="342">Router</text><text class="s" x="365" y="362">Site B</text>
<path class="l" marker-start="url(#e)" marker-end="url(#e)" d="M152 305L195 335"/><path class="l" marker-start="url(#e)" marker-end="url(#e)" d="M152 389L195 359"/>
