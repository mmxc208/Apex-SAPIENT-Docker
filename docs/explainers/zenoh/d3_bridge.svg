<rect class="b" x="866" y="190" width="104" height="82" rx="8"/><text class="t" x="918" y="216">Fusion</text><text class="s" x="918" y="236">Stone Soup</text><text class="s" x="918" y="254">+ bridge</text>
<rect class="b" x="722" y="352" width="112" height="60" rx="8"/><text class="t" x="778" y="377">Archive</text><text class="s" x="778" y="397">SQLite, Elastic</text>
<rect class="b" x="540" y="352" width="130" height="60" rx="8"/><text class="t" x="605" y="377">Direct sensor</text><text class="s" x="605" y="397">plain TCP, required</text>
<path class="a" d="M581 230L610 230"/>
<path class="l" marker-start="url(#e)" marker-end="url(#e)" d="M698 230L728 230"/>
