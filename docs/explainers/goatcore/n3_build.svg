<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Describe, rehearse, build, check">
<style>
text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.b{fill:#121b2e;stroke:#3a4a6a;stroke-width:1.5}
.h{fill:#1f3350;stroke:#38bdf8;stroke-width:2}
.g{fill:#17352a;stroke:#34d399;stroke-width:2}
.d{fill:#121b2e;stroke:#f59e0b;stroke-width:1.6;stroke-dasharray:6 4}
.r{fill:#3a1c22;stroke:#f87171;stroke-width:2}
.fr{fill:none;stroke:#34435f;stroke-width:1.5;stroke-dasharray:3 4}
.t{fill:#e6edf6;font-size:16px;font-weight:650;text-anchor:middle}
.T{fill:#e6edf6;font-size:19px;font-weight:700;text-anchor:middle}
.s{fill:#93a4bf;font-size:13.5px;text-anchor:middle}
.q{fill:#93a4bf;font-size:13.5px}
.n{fill:#e6edf6;font-size:15px;font-weight:650}
.k{fill:#38bdf8;font-size:13px;font-weight:700;letter-spacing:.12em}
.m{fill:#cfe3ff;font-size:14px;font-family:"SF Mono",Menlo,monospace}
.mc{fill:#cfe3ff;font-size:14px;font-family:"SF Mono",Menlo,monospace;text-anchor:middle}
.ok{fill:#34d399;font-size:13px;font-weight:700}
.wa{fill:#f59e0b;font-size:13px;font-weight:700}
.wac{fill:#f59e0b;font-size:13.5px;font-weight:700;text-anchor:middle}
.okc{fill:#34d399;font-size:13.5px;font-weight:700;text-anchor:middle}
.rdc{fill:#f87171;font-size:13.5px;font-weight:700;text-anchor:middle}
.l{fill:none;stroke:#93a4bf;stroke-width:1.6}
.f{fill:none;stroke:#93a4bf;stroke-width:1.3;stroke-dasharray:4 4}
.a{fill:none;stroke:#38bdf8;stroke-width:3}
.gl{fill:none;stroke:#34d399;stroke-width:3}
.w{fill:none;stroke:#f59e0b;stroke-width:1.8;stroke-dasharray:6 4}
.x{fill:none;stroke:#f87171;stroke-width:4}
</style>
<defs>
<marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#93a4bf" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path fill="#38bdf8" d="M0 0L10 5L0 10z"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#f59e0b" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="b" x="25" y="60" width="215" height="150" rx="10"/><text class="T" x="132.5" y="110.0">1 · Describe</text><text class="s" x="132.5" y="131.0">write one description</text><text class="s" x="132.5" y="150.0">of the network:</text><text class="s" x="132.5" y="169.0">sites, machines, roles</text><path class="l" d="M240 135L270 135" marker-end="url(#e)"/><rect class="g" x="270" y="60" width="215" height="150" rx="10"/><text class="T" x="377.5" y="110.0">2 · Rehearse</text><text class="s" x="377.5" y="131.0">do the full build</text><text class="s" x="377.5" y="150.0">on a laptop with</text><text class="s" x="377.5" y="169.0">simulated machines</text><path class="l" d="M485 135L515 135" marker-end="url(#e)"/><rect class="h" x="515" y="60" width="215" height="150" rx="10"/><text class="T" x="622.5" y="110.0">3 · Build</text><text class="s" x="622.5" y="131.0">the same tool builds</text><text class="s" x="622.5" y="150.0">the real machines</text><text class="s" x="622.5" y="169.0">in 14 steps</text><path class="l" d="M730 135L760 135" marker-end="url(#e)"/><rect class="g" x="760" y="60" width="215" height="150" rx="10"/><text class="T" x="867.5" y="110.0">4 · Check</text><text class="s" x="867.5" y="131.0">each machine records</text><text class="s" x="867.5" y="150.0">its condition; complete =</text><text class="s" x="867.5" y="169.0">all reports agree</text><rect class="b" x="25" y="270" width="460" height="120" rx="10"/><text class="T" x="255.0" y="305.0">If there is an error</text><text class="s" x="255.0" y="326.0">each error message gives the cause</text><text class="s" x="255.0" y="345.0">and the correction</text><text class="s" x="255.0" y="364.0">162 known errors, explained with no network</text><rect class="b" x="515" y="270" width="460" height="120" rx="10"/><text class="T" x="745.0" y="305.0">If a change is incorrect</text><text class="s" x="745.0" y="326.0">go back to an earlier version,</text><text class="s" x="745.0" y="345.0">one step at a time</text><text class="s" x="745.0" y="364.0">the tool refuses dangerous types of change</text><text class="s" x="500" y="436" style="font-size:16px">Smallest version: one machine, one file with four values, approximately 24 minutes of automatic steps.</text>
</svg>
