<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-label="Publish and subscribe with access by identity">
<style>
text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.b{fill:#121b2e;stroke:#3a4a6a;stroke-width:1.5}
.h{fill:#1f3350;stroke:#38bdf8;stroke-width:2}
.g{fill:#17352a;stroke:#34d399;stroke-width:2}
.d{fill:#121b2e;stroke:#f59e0b;stroke-width:1.6;stroke-dasharray:6 4}
.r{fill:#3a1c22;stroke:#f87171;stroke-width:2}
.fr{fill:none;stroke:#34435f;stroke-width:1.5;stroke-dasharray:3 4}
.t{fill:#e6edf6;font-size:16px;font-weight:650;text-anchor:middle}
.T{fill:#e6edf6;font-size:19px;font-weight:700;text-anchor:middle}
.s{fill:#93a4bf;font-size:13.5px;text-anchor:middle}
.q{fill:#93a4bf;font-size:13.5px}
.n{fill:#e6edf6;font-size:15px;font-weight:650}
.k{fill:#38bdf8;font-size:13px;font-weight:700;letter-spacing:.12em}
.m{fill:#cfe3ff;font-size:14px;font-family:"SF Mono",Menlo,monospace}
.mc{fill:#cfe3ff;font-size:14px;font-family:"SF Mono",Menlo,monospace;text-anchor:middle}
.ok{fill:#34d399;font-size:13px;font-weight:700}
.wa{fill:#f59e0b;font-size:13px;font-weight:700}
.wac{fill:#f59e0b;font-size:13.5px;font-weight:700;text-anchor:middle}
.okc{fill:#34d399;font-size:13.5px;font-weight:700;text-anchor:middle}
.rdc{fill:#f87171;font-size:13.5px;font-weight:700;text-anchor:middle}
.l{fill:none;stroke:#93a4bf;stroke-width:1.6}
.f{fill:none;stroke:#93a4bf;stroke-width:1.3;stroke-dasharray:4 4}
.a{fill:none;stroke:#38bdf8;stroke-width:3}
.gl{fill:none;stroke:#34d399;stroke-width:3}
.w{fill:none;stroke:#f59e0b;stroke-width:1.8;stroke-dasharray:6 4}
.x{fill:none;stroke:#f87171;stroke-width:4}
</style>
<defs>
<marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#93a4bf" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path fill="#38bdf8" d="M0 0L10 5L0 10z"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#f59e0b" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="g" x="30" y="200" width="210" height="110" rx="10"/><text class="T" x="135.0" y="240.0">Radar team</text><text class="s" x="135.0" y="261.0">publishes “tracks”</text><text class="s" x="135.0" y="280.0">shows its certificate</text><rect class="h" x="380" y="180" width="240" height="150" rx="10"/><text class="T" x="500.0" y="220.0">Site router</text><text class="s" x="500.0" y="241.0">examines the certificate</text><text class="s" x="500.0" y="260.0">uses an access list</text><text class="s" x="500.0" y="279.0">refuses all other writes</text><text class="s" x="500.0" y="298.0">keeps a copy for 7 days</text><path class="a" d="M240 255L380 255" marker-end="url(#c)"/><rect class="g" x="760" y="60" width="210" height="96" rx="10"/><text class="T" x="865.0" y="103.0">Operations room</text><text class="s" x="865.0" y="124.0">subscribes to “tracks”</text><rect class="g" x="760" y="207" width="210" height="96" rx="10"/><text class="T" x="865.0" y="240.0">Partner unit</text><text class="s" x="865.0" y="261.0">gets only</text><text class="s" x="865.0" y="280.0">released data</text><rect class="r" x="760" y="354" width="210" height="96" rx="10"/><text class="T" x="865.0" y="387.0">Unknown device</text><text class="s" x="865.0" y="408.0">no valid certificate</text><text class="rdc" x="865.0" y="427.0">gets no data</text><path class="a" d="M620 225L760 115" marker-end="url(#c)"/><path class="a" d="M620 255L760 255" marker-end="url(#c)"/><path class="f" d="M620 290L700 345"/><path class="x" d="M690 325L716 361"/><path class="x" d="M716 325L690 361"/><rect class="b" x="380" y="400" width="240" height="86" rx="10"/><text class="t" x="500.0" y="428.0">Audit copy</text><text class="s" x="500.0" y="449.0">a store keeps a copy that</text><text class="s" x="500.0" y="468.0">no person can change</text><path class="l" d="M500 330L500 400" marker-end="url(#e)"/><text class="s" x="500" y="60" style="font-size:16px">The sender gives the subject, not the receiver.</text><text class="s" x="500" y="84" style="font-size:16px">A permitted subscriber to that subject gets the data.</text>
</svg>
