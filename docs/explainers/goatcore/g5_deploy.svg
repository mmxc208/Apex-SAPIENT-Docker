<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-label="How a goatnet is deployed and verified">
<style>
text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.b{fill:#121b2e;stroke:#3a4a6a;stroke-width:1.5}
.h{fill:#1f3350;stroke:#38bdf8;stroke-width:2}
.g{fill:#17352a;stroke:#34d399;stroke-width:2}
.d{fill:#121b2e;stroke:#f59e0b;stroke-width:1.6;stroke-dasharray:6 4}
.r{fill:#3a1c22;stroke:#f87171;stroke-width:2}
.fr{fill:none;stroke:#34435f;stroke-width:1.5;stroke-dasharray:3 4}
.t{fill:#e6edf6;font-size:16px;font-weight:650;text-anchor:middle}
.T{fill:#e6edf6;font-size:19px;font-weight:700;text-anchor:middle}
.s{fill:#93a4bf;font-size:13.5px;text-anchor:middle}
.q{fill:#93a4bf;font-size:13.5px}
.n{fill:#e6edf6;font-size:15px;font-weight:650}
.k{fill:#38bdf8;font-size:13px;font-weight:700;letter-spacing:.12em}
.m{fill:#cfe3ff;font-size:14px;font-family:"SF Mono",Menlo,monospace}
.mc{fill:#cfe3ff;font-size:14px;font-family:"SF Mono",Menlo,monospace;text-anchor:middle}
.ok{fill:#34d399;font-size:13px;font-weight:700}
.wa{fill:#f59e0b;font-size:13px;font-weight:700}
.wac{fill:#f59e0b;font-size:13.5px;font-weight:700;text-anchor:middle}
.okc{fill:#34d399;font-size:13.5px;font-weight:700;text-anchor:middle}
.rdc{fill:#f87171;font-size:13.5px;font-weight:700;text-anchor:middle}
.l{fill:none;stroke:#93a4bf;stroke-width:1.6}
.f{fill:none;stroke:#93a4bf;stroke-width:1.3;stroke-dasharray:4 4}
.a{fill:none;stroke:#38bdf8;stroke-width:3}
.gl{fill:none;stroke:#34d399;stroke-width:3}
.w{fill:none;stroke:#f59e0b;stroke-width:1.8;stroke-dasharray:6 4}
.x{fill:none;stroke:#f87171;stroke-width:4}
</style>
<defs>
<marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#93a4bf" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path fill="#38bdf8" d="M0 0L10 5L0 10z"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#f59e0b" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="b" x="25" y="30" width="240" height="104" rx="10"/><text class="t" x="145.0" y="67.0">goatcore at a pinned commit</text><text class="s" x="145.0" y="88.0">code, roles, modules, images</text><text class="s" x="145.0" y="107.0">no deployment values at all</text><rect class="b" x="25" y="156" width="240" height="122" rx="10"/><text class="t" x="145.0" y="182.0">Overlay repository</text><text class="s" x="145.0" y="203.0">goatcore.ref · group_vars</text><text class="s" x="145.0" y="222.0">inventory · pins rows</text><text class="s" x="145.0" y="241.0">Terraform roots</text><text class="s" x="145.0" y="260.0">configuration only</text><rect class="h" x="320" y="92" width="220" height="124" rx="10"/><text class="T" x="430.0" y="129.0">goatbuilder</text><text class="s" x="430.0" y="150.0">declare · converge · verify</text><text class="s" x="430.0" y="169.0">14-phase standup</text><text class="s" x="430.0" y="188.0">resumable, idempotent</text><path class="l" d="M265 82L320 130" marker-end="url(#e)"/><path class="l" d="M265 217L320 178" marker-end="url(#e)"/><rect class="fr" x="595" y="20" width="385" height="262" rx="14"/><text class="k" x="615" y="48">CONVERGER · publish / observe / read_record</text><rect class="g" x="613" y="62" width="349" height="60" rx="10"/><text class="t" x="787.5" y="87.0">scripted fixtures: the --mock rehearsal</text><text class="okc" x="787.5" y="108.0">built</text><rect class="g" x="613" y="134" width="349" height="60" rx="10"/><text class="t" x="787.5" y="159.0">push: Ansible from the operator's machine</text><text class="okc" x="787.5" y="180.0">built · the path in use today</text><rect class="d" x="613" y="206" width="349" height="60" rx="10"/><text class="t" x="787.5" y="231.0">pull agent on each machine</text><text class="wac" x="787.5" y="252.0">designed, not built (ADR 1109)</text><path class="a" d="M540 154L595 154" marker-end="url(#c)"/><rect class="b" x="595" y="330" width="385" height="112" rx="10"/><text class="T" x="787.5" y="361.0">Site hosts</text><text class="s" x="787.5" y="382.0">each machine writes its own ledger:</text><text class="mc" x="787.5" y="401.0">/var/lib/goat/&lt;component&gt;/</text><text class="mc" x="787.5" y="420.0">deploy-history.jsonl</text><path class="l" d="M787 282L787 330" marker-end="url(#e)"/><path class="gl" d="M595 386C470 386 430 320 430 216" marker-end="url(#e)"/><text class="okc" x="430" y="420">verify: a machine is done only when its</text><text class="okc" x="430" y="439">own record names the declared digest</text><text class="s" x="430" y="460">unreadable record = unknown, never done</text><rect class="h" x="25" y="330" width="240" height="112" rx="10"/><text class="T" x="145.0" y="361.0">goat</text><text class="s" x="145.0" y="382.0">operate: pub, sub, top, who,</text><text class="s" x="145.0" y="401.0">acl, health, explain …</text><text class="s" x="145.0" y="420.0">162 catalogued errors</text><text class="s" x="500" y="505">Nothing about a deployment is compiled into a binary or baked into an image: one build serves every deployment.</text>
</svg>
