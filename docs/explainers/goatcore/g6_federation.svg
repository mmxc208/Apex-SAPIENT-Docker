<defs>
<marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#93a4bf" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path fill="#38bdf8" d="M0 0L10 5L0 10z"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#f59e0b" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="d" x="20" y="10" width="960" height="36" rx="8"/><text class="wac" x="500" y="33">Status: ADR 1157 and ADR 1225 are Proposed. goat 0.5.19 has the parts. The one-command procedure is not complete.</text><rect class="fr" x="20" y="60" width="425" height="318" rx="16"/><text class="k" x="40" y="86">OUR ENVIRONMENT</text><rect class="fr" x="555" y="60" width="425" height="318" rx="16"/><text class="k" x="575" y="86">PARTNER ENVIRONMENT</text><rect class="h" x="40" y="104" width="185" height="100" rx="10"/><text class="T" x="132.5" y="129.0">Core router</text><text class="s" x="132.5" y="150.0">trusts OUR CA only</text><text class="s" x="132.5" y="169.0">admits the republisher</text><text class="s" x="132.5" y="188.0">by its certificate name</text><rect class="d" x="245" y="104" width="185" height="100" rx="10"/><text class="T" x="337.5" y="129.0">Edge router</text><text class="s" x="337.5" y="150.0">one zenohd for this partner</text><text class="s" x="337.5" y="169.0">trusts THEIR CA only</text><text class="s" x="337.5" y="188.0">ACL: deny by default</text><rect class="b" x="40" y="250" width="185" height="110" rx="10"/><text class="T" x="132.5" y="270.0">Republisher</text><text class="s" x="132.5" y="291.0">reads</text><text class="mc" x="132.5" y="310.0">release/&lt;set&gt;/**</text><text class="s" x="132.5" y="329.0">writes</text><text class="mc" x="132.5" y="348.0">from/&lt;us&gt;/&lt;set&gt;/**</text><rect class="d" x="570" y="104" width="185" height="100" rx="10"/><text class="T" x="662.5" y="129.0">Edge router</text><text class="s" x="662.5" y="150.0">one zenohd for us</text><text class="s" x="662.5" y="169.0">trusts OUR CA only</text><text class="s" x="662.5" y="188.0">ACL: deny by default</text><rect class="h" x="775" y="104" width="185" height="100" rx="10"/><text class="T" x="867.5" y="129.0">Core router</text><text class="s" x="867.5" y="150.0">trusts THEIR CA only</text><text class="s" x="867.5" y="169.0">admits the republisher</text><text class="s" x="867.5" y="188.0">by its certificate name</text><rect class="b" x="775" y="250" width="185" height="110" rx="10"/><text class="T" x="867.5" y="270.0">Republisher</text><text class="s" x="867.5" y="291.0">reads</text><text class="mc" x="867.5" y="310.0">release/&lt;set&gt;/**</text><text class="s" x="867.5" y="329.0">writes</text><text class="mc" x="867.5" y="348.0">from/&lt;them&gt;/&lt;set&gt;/**</text><path class="l" d="M225 154L245 154" marker-start="url(#e)" marker-end="url(#e)"/><path class="l" d="M755 154L775 154" marker-start="url(#e)" marker-end="url(#e)"/><path class="l" d="M132 250L132 204" marker-end="url(#e)"/><path class="l" d="M867 250L867 204" marker-end="url(#e)"/><path class="w" d="M430 154L570 154" marker-start="url(#y)" marker-end="url(#y)"/><text class="wac" x="500" y="136">one tunnel</text><text class="s" x="500" y="180">WireGuard</text><text class="s" x="500" y="198">or IPsec</text><rect class="b" x="245" y="250" width="185" height="110" rx="10"/><text class="t" x="337.5" y="270.0">On the wire</text><text class="s" x="337.5" y="291.0">our data has the prefix</text><text class="mc" x="337.5" y="310.0">from/&lt;us&gt;/</text><text class="s" x="337.5" y="329.0">the key does not change</text><text class="s" x="337.5" y="348.0">in transit</text><rect class="b" x="570" y="250" width="185" height="110" rx="10"/><text class="t" x="662.5" y="270.0">On the wire</text><text class="s" x="662.5" y="291.0">their data has the prefix</text><text class="mc" x="662.5" y="310.0">from/&lt;them&gt;/</text><text class="s" x="662.5" y="329.0">the key does not change</text><text class="s" x="662.5" y="348.0">in transit</text><text class="k" x="500" y="410" text-anchor="middle">ACCESS LEVEL FOR EACH PARTNER</text><rect class="b" x="115" y="426" width="210" height="62" rx="10"/><text class="t" x="220.0" y="452.0">recognised</text><text class="s" x="220.0" y="473.0">we hold their CA bundle</text><path class="l" d="M325 457L395 457" marker-end="url(#e)"/><rect class="b" x="395" y="426" width="210" height="62" rx="10"/><text class="t" x="500.0" y="452.0">connected</text><text class="s" x="500.0" y="473.0">tunnel and TLS are up</text><path class="l" d="M605 457L675 457" marker-end="url(#e)"/><rect class="b" x="675" y="426" width="210" height="62" rx="10"/><text class="t" x="780.0" y="452.0">exchanging</text><text class="s" x="780.0" y="473.0">an ACL block permits data</text><text class="s" x="500" y="520">Each side does the same four steps: tunnel, trust bundle, identity, permission. One side can end the peering alone.</text>
</svg>
