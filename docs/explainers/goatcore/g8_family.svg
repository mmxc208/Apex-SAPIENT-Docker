<defs>
<marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#93a4bf" d="M0 0L10 5L0 10z"/></marker>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path fill="#38bdf8" d="M0 0L10 5L0 10z"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#f59e0b" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="h" x="25" y="30" width="225" height="104" rx="10"/><text class="T" x="137.5" y="67.0">goatcore</text><text class="s" x="137.5" y="88.0">builds and runs a goatnet</text><text class="s" x="137.5" y="107.0">mesh, fabric, identity, tools</text><rect class="b" x="267" y="30" width="225" height="104" rx="10"/><text class="T" x="379.5" y="67.0">goatenv</text><text class="s" x="379.5" y="88.0">an example environment</text><text class="s" x="379.5" y="107.0">configuration only</text><rect class="b" x="509" y="30" width="225" height="104" rx="10"/><text class="T" x="621.5" y="67.0">goatdocs</text><text class="s" x="621.5" y="88.0">architecture documents</text><text class="s" x="621.5" y="107.0">and guides</text><rect class="b" x="751" y="30" width="225" height="104" rx="10"/><text class="T" x="863.5" y="67.0">goat-client</text><text class="s" x="863.5" y="88.0">daemon, GUI and CLI</text><text class="s" x="863.5" y="107.0">for the mesh</text><rect class="g" x="25" y="152" width="225" height="104" rx="10"/><text class="T" x="137.5" y="189.0">goatstuff</text><text class="s" x="137.5" y="210.0">inspection tools and demos</text><text class="s" x="137.5" y="229.0">optional</text><rect class="b" x="267" y="152" width="225" height="104" rx="10"/><text class="T" x="379.5" y="189.0">netbird</text><text class="s" x="379.5" y="210.0">NetBird fork</text><text class="s" x="379.5" y="229.0">with the goat patches</text><rect class="b" x="509" y="152" width="225" height="104" rx="10"/><text class="T" x="621.5" y="189.0">saltlick</text><text class="s" x="621.5" y="210.0">peering directory</text><text class="s" x="621.5" y="229.0">for federation</text><rect class="b" x="751" y="152" width="225" height="104" rx="10"/><text class="T" x="863.5" y="189.0">goatrodeo</text><text class="s" x="863.5" y="210.0">games that use</text><text class="s" x="863.5" y="229.0">the Zenoh fabric</text><rect class="g" x="25" y="274" width="225" height="104" rx="10"/><text class="T" x="137.5" y="311.0">open-billie</text><text class="s" x="137.5" y="332.0">sensor node platform</text><text class="s" x="137.5" y="351.0">tracks go to Zenoh</text><rect class="g" x="267" y="274" width="225" height="104" rx="10"/><text class="T" x="379.5" y="311.0">octo-pod</text><text class="s" x="379.5" y="332.0">edge appliance for equipment</text><text class="s" x="379.5" y="351.0">that cannot join a fabric</text><rect class="d" x="509" y="274" width="225" height="104" rx="10"/><text class="T" x="621.5" y="311.0">zagros-moon-pod</text><text class="s" x="621.5" y="332.0">partner pod for exercises</text><text class="s" x="621.5" y="351.0">a learning tool</text><rect class="b" x="751" y="274" width="225" height="104" rx="10"/><text class="T" x="863.5" y="311.0">hello-galaxy-*</text><text class="s" x="863.5" y="332.0">14 tutorial repositories</text><text class="s" x="863.5" y="351.0">one topic each</text><text class="s" x="500" y="424" style="font-size:15px">26 public repositories in the USAREUR-AF organization on 11 November 2026. The count includes the shared .github repository.</text>
</svg>
