<rect class="fr" x="20" y="20" width="580" height="510" rx="16"/><text class="k" x="40" y="48">SITE ALPHA · FOUR-NODE BASELINE (ADR 1141)</text><rect class="h" x="40" y="66" width="262" height="204" rx="10"/><text class="T" x="171.0" y="123.0">core-A · active</text><text class="s" x="171.0" y="144.0">NetBird management + signal</text><text class="s" x="171.0" y="163.0">PostgreSQL 16 + Spock 5</text><text class="s" x="171.0" y="182.0">Ory Kratos + Hydra</text><text class="s" x="171.0" y="201.0">Traefik · SPIRE server</text><text class="s" x="171.0" y="220.0">Zenoh router (zenohd)</text><rect class="d" x="318" y="66" width="262" height="204" rx="10"/><text class="T" x="449.0" y="123.0">core-B · warm standby</text><text class="s" x="449.0" y="144.0">NetBird management + signal</text><text class="s" x="449.0" y="163.0">PostgreSQL 16 + Spock 5</text><text class="s" x="449.0" y="182.0">Ory Kratos + Hydra</text><text class="s" x="449.0" y="201.0">Traefik · SPIRE server</text><text class="wac" x="449.0" y="220.0">promotion is operator-fired</text><rect class="b" x="40" y="296" width="262" height="214" rx="10"/><text class="T" x="171.0" y="358.0">obs-A · active</text><text class="s" x="171.0" y="379.0">Prometheus · Grafana</text><text class="s" x="171.0" y="398.0">Alertmanager · exporters</text><text class="s" x="171.0" y="417.0">Vector log shipper</text><text class="s" x="171.0" y="436.0">MinIO Object-Lock audit store</text><text class="s" x="171.0" y="455.0">OpenTelemetry collector</text><rect class="d" x="318" y="296" width="262" height="214" rx="10"/><text class="T" x="449.0" y="368.0">obs-B · warm standby</text><text class="s" x="449.0" y="389.0">same stack, cutover-gated</text><text class="s" x="449.0" y="408.0">MinIO runs as the</text><text class="s" x="449.0" y="427.0">replication target</text><text class="wac" x="449.0" y="446.0">second audit copy</text><rect class="fr" x="770" y="110" width="210" height="330" rx="16"/><text class="k" x="875" y="140" text-anchor="middle">SITE BRAVO</text><rect class="h" x="790" y="160" width="170" height="110" rx="10"/><text class="t" x="875.0" y="200.0">core pair</text><text class="s" x="875.0" y="221.0">full copy of</text><text class="s" x="875.0" y="240.0">management state</text><rect class="b" x="790" y="296" width="170" height="110" rx="10"/><text class="t" x="875.0" y="336.0">obs pair</text><text class="s" x="875.0" y="357.0">its own metrics</text><text class="s" x="875.0" y="376.0">and audit</text><path class="a" d="M600 180L790 180"/><text class="s" x="695" y="172">Spock multi-master</text><path class="gl" d="M600 215L790 215"/><text class="s" x="695" y="207">Zenoh router to router</text><path class="l" d="M600 250L790 250"/><text class="s" x="695" y="242">signal federation</text><text class="s" x="800" y="470">replicated: NetBird (20 tables) and Ory (10 tables)</text><text class="s" x="800" y="491">conflicts: last write wins; admin writes pinned to one site</text><text class="wac" x="800" y="520">island-mode writes: designed, not built (ADR 1165)</text>
</svg>
