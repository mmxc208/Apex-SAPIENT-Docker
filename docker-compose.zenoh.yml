# Eclipse Zenoh router and the stage 1 sidecar bridges. The router alone:
#   docker compose -f docker-compose.yml -f docker-compose.zenoh.yml up -d zenohd
# The TCP sensors over Zenoh need docker-compose.zenoh-sensors.yml as well
# (see "Stage 1: Option A bridge" in README.md):
#   docker compose -f docker-compose.yml -f docker-compose.emulators.yml -f docker-compose.zenoh.yml \
#     -f docker-compose.zenoh-sensors.yml up -d --build

x-bridge: &bridge
  image: apex-sapient:4.2.0   # built by docker-compose.yml; has Python, protobuf, sapient_msg and zenoh
  working_dir: /emulators
  volumes:
    - ./emulators:/emulators:ro
  restart: unless-stopped

services:
  zenohd:
    image: eclipse/zenoh:1.10.2
    command: ["-c", "/config/router.json5"]
    volumes:
      - ./zenoh/router-plain.json5:/config/router.json5:ro
    ports:
      - "7447:7447"
    restart: unless-stopped

  bridge-node:
    <<: *bridge
    command: python bridge_node_side.py
    environment:
      ZENOH_CONNECT: tcp/zenohd:7447
      LISTEN_PORT: "5020"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - zenohd

  bridge-apex:
    <<: *bridge
    command: python bridge_apex_side.py
    environment:
      ZENOH_CONNECT: tcp/zenohd:7447
      APEX_HOST: apex
      APEX_PORT: "5020"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      - zenohd
      - apex
